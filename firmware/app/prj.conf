CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=y
CONFIG_PM=y
CONFIG_WATCHDOG=y
CONFIG_REBOOT=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_STACK_SENTINEL=y
CONFIG_GPIO=y

# ---- LED PWM: all 8 LEDs (pwm2=track, pwm3=side) driven at a global brightness
# via led.c, replacing raw-GPIO on/off so they can run dimmed. The nrfx PWM driver
# is auto-selected for the &pwm2/&pwm3 nodes enabled in app.overlay. ----
CONFIG_PWM=y

# ---- M2.2: SAADC fader/ladder read + USB-CDC debug console ----
CONFIG_ADC=y

# USB composite on the device_next stack via the sample_usbd helper: a CDC ACM
# console + a hand-rolled USB-MIDI 1.0 class (usb_midi1.c, USBD_DEFINE_CLASS).
# Both class instances are auto-registered by usbd_register_all_classes inside
# sample_usbd_init_device (M4.1). The old USB-MIDI 2.0 (usbd_midi2) class was
# dropped: feldd used no 2.0 feature, and a single MIDI-1.0 function enumerates
# cleanly on Mac/Win/iOS/old-Linux without the dual-MIDIStreaming compat risk.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
# Studio phase 2a: a first-party Zephyr usbd_hid boot-keyboard function joins the
# composite (usb_hid.c + the hid_dev_0 DT node in app.overlay). This Kconfig is
# default-y once DT_HAS_ZEPHYR_HID_DEVICE_ENABLED (the node makes it so), but we
# pin it explicitly to mirror the hid-keyboard sample and make the dependency
# obvious. The HID class self-registers into sample_usbd alongside CDC + MIDI1.
CONFIG_USBD_HID_SUPPORT=y
# v0.3.8: give the CDC ACM its OWN workqueue. Its TX send (tx_fifo_work) was
# starved on the shared system workqueue (USB-MIDI + USB stack contend for it),
# so config replies only flushed while RX kept re-waking the queue. The Kconfig
# help for this option describes exactly that: "use the dedicated queue ... if
# the system workqueue cannot be used due to performance issues or other
# conflicts." Dedicated queue = TX drains on its own.
CONFIG_USBD_CDC_ACM_WORKQUEUE=y
CONFIG_USBD_CDC_ACM_STACK_SIZE=2048
# The app owns the single usbd context (sample_usbd_init_device + usbd_enable);
# do NOT let the CDC SYS_INIT build a second private context that fights for
# the controller.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_PRINTK=y
CONFIG_HWINFO=y

# USB device identity for the sample_usbd helper. New PID (0x5211, bumped from
# the CDC-only 0x5210) so a host does not reuse a cached driver now that the
# device is a CDC+MIDI composite.
CONFIG_SAMPLE_USBD_PRODUCT="SP-1 Control Surface"
# Nordic Semiconductor VID (0x1915). Pin it so we stop inheriting Zephyr's shared
# test VID 0x2FE3; this is the constant the WebSerial filter hardcodes
# ({ usbVendorId: 0x1915 }), paired with PID 0x5211.
CONFIG_SAMPLE_USBD_VID=0x1915
CONFIG_SAMPLE_USBD_PID=0x5211

# USB stack + printf want a roomier main stack than the bare power build;
# device_next USBD init (descriptor build + class registration) needs headroom.
CONFIG_MAIN_STACK_SIZE=4096

# ---- M5.2: NVS-backed profile librarian ----
# NVS persists the 8 profiles + the active index in the 16 KB storage_partition
# carved at flash 0xFB000 (app.overlay), ending at the reserved 0xFF000
# bootloader page. FLASH_MAP/FLASH_PAGE_LAYOUT give the
# FIXED_PARTITION_* macros + page geometry NVS needs; MPU_ALLOW_FLASH_WRITE lets
# the running app write its own flash region on the nRF52840.
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
