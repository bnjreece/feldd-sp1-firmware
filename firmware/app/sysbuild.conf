# SP-1 sysbuild configuration.
#
# Disable NCS Partition Manager. The SP-1 has a FIXED external TE bootloader
# that dictates the flash map; there is no NCS/MCUboot bootloader and only a
# single app image, so PM has nothing legitimate to place. Left enabled, PM
# auto-derives a flash model that is WRONG for this hardware:
#   - it places `app` at 0x0 (ignoring the 0x0-0x20000 TE bootloader), and
#   - it places `nvs_storage` at 0xFA000-0x100000, which runs INTO the reserved
#     0xFF000 bootloader-settings/MBR page (writing it could brick the
#     bootloader, our recovery path).
#
# With PM off, FLASH_MAP_CUSTOM is not selected, so the Flash Map API
# (FIXED_PARTITION_*) reads the devicetree fixed-partitions instead. Those are
# correct for the SP-1: bootloader@0 (0x20000), app@0x20000 (0xBF000), and
# storage@0xFB000 (0x4000, ending exactly at the reserved 0xFF000 page) from
# app.overlay. The app still links at 0x20000 via the board's ROM_START_OFFSET
# (CONFIG_FLASH_LOAD_OFFSET=0x20000), which is independent of PM.
SB_CONFIG_PARTITION_MANAGER=n
